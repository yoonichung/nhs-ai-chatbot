[project]
name = "nhs-ai-chatbot"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Yooni Chung", email = "youngyoon.chung@hotmail.com" }
]
dependencies = [
    "langchain>=0.3.14",
    "chromadb>=0.6.3",
    "pypdf>=5.1.0",
    "pytest>=8.3.4",
    "langchain-community>=0.3.14",
]
readme = "README.md"
requires-python = ">= 3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/nhs_ai_chatbot"]
